<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTechX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

<!-- =====================================================================
     1) HEAD SCRIPT: paste inside <head>. Prevents a flash of the intro
        when it has already played in this browser session.
     ===================================================================== -->
<script>
try { if (sessionStorage.getItem('btxIntroSeen')) document.documentElement.classList.add('btx-skip'); } catch (e) {}
</script>
<noscript><style>#btx-intro{display:none !important}</style></noscript>

<!-- =====================================================================
     2) INTRO CSS: paste into your stylesheet (or a <style> tag)
     ===================================================================== -->
<style>
html.btx-lock, html.btx-lock body { overflow: hidden; }
html.btx-skip #btx-intro { display: none; }

#btx-intro {
  position: fixed; inset: 0; z-index: 99999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: #05060a; color: #fff; overflow: hidden; cursor: pointer;
  font-family: 'Poppins', system-ui, sans-serif;
  transition: opacity .5s ease, transform .5s ease, filter .5s ease;
}
#btx-intro.btx-out { opacity: 0; transform: scale(1.08); filter: blur(6px); pointer-events: none; }

/* backdrop: soft glows + faint grid */
#btx-intro .btx-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(60% 50% at 80% 90%, rgba(37, 80, 220, .35), transparent 70%),
    radial-gradient(50% 40% at 15% 5%, rgba(14, 120, 170, .28), transparent 70%);
  animation: btx-fade 1s ease both;
}
#btx-intro .btx-bg::after {
  content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
  background-size: 64px 64px;
  -webkit-mask-image: radial-gradient(circle at center, #000 20%, transparent 75%);
          mask-image: radial-gradient(circle at center, #000 20%, transparent 75%);
}

/* logo: written on from left to right with a light streak */
#btx-intro .btx-logo { position: relative; display: flex; align-items: center; gap: .08em; z-index: 1; font-size: clamp(64px, 17vw, 200px); }
#btx-intro .btx-word {
  font-family: 'Dancing Script', cursive; font-weight: 600; line-height: 1.1; padding: 0 .06em;
  text-shadow: 0 0 28px rgba(80, 140, 255, .55);
  clip-path: inset(0 100% 0 0);
  animation: btx-write .9s cubic-bezier(.65, 0, .35, 1) .3s forwards;
}
#btx-intro .btx-logo::after {
  content: ""; position: absolute; top: -8%; bottom: -8%; width: 3px; left: 0; opacity: 0;
  background: linear-gradient(#0000, #cfe3ff, #0000); box-shadow: 0 0 24px 6px rgba(90, 150, 255, .8);
  animation: btx-sweep .9s cubic-bezier(.65, 0, .35, 1) .3s forwards;
}
#btx-intro .btx-chev { height: .42em; width: auto; overflow: visible; }
#btx-intro .btx-chev path {
  fill: none; stroke: #3b82f6; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 120; stroke-dashoffset: 120; filter: drop-shadow(0 0 8px rgba(59, 130, 246, .9));
  animation: btx-draw .45s ease 1.05s forwards;
}

#btx-intro .btx-line {
  height: 3px; width: 0; margin-top: 1.2vh; border-radius: 3px; z-index: 1;
  background: linear-gradient(90deg, #38bdf8, #3b82f6);
  box-shadow: 0 0 16px rgba(56, 189, 248, .7);
  animation: btx-grow .6s ease 1s forwards;
}
#btx-intro .btx-tag {
  z-index: 1; margin-top: 3.5vh; opacity: 0; color: #c9d2e6; font-weight: 500;
  font-size: clamp(14px, 2.6vw, 26px); letter-spacing: .5em;
  animation: btx-tag .8s ease 1.15s forwards;
}
#btx-intro .btx-by {
  z-index: 1; margin-top: 2.6vh; opacity: 0; color: #8b93a8; font-size: clamp(13px, 2vw, 19px);
  animation: btx-fade .6s ease 1.95s forwards;
}
#btx-intro .btx-by b { color: #fff; font-weight: 500; }
#btx-intro .btx-skip {
  position: absolute; right: 20px; bottom: 16px; z-index: 1; opacity: 0; color: #5d6580; font-size: 12px;
  animation: btx-fade .5s ease 1s forwards;
}

@keyframes btx-write { to { clip-path: inset(0 0 0 0); } }
@keyframes btx-sweep { 0% { left: 0; opacity: 1; } 85% { opacity: 1; } 100% { left: 100%; opacity: 0; } }
@keyframes btx-draw  { to { stroke-dashoffset: 0; } }
@keyframes btx-grow  { to { width: min(62vw, 560px); } }
@keyframes btx-tag   { from { opacity: 0; letter-spacing: .5em; filter: blur(6px); } to { opacity: 1; letter-spacing: .2em; filter: blur(0); } }
@keyframes btx-fade  { from { opacity: 0; } to { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  #btx-intro *, #btx-intro .btx-bg { animation-duration: .01s !important; animation-delay: 0s !important; }
  #btx-intro .btx-logo::after { display: none; }
}
</style>
</head>

<body>

<!-- =====================================================================
     3) INTRO HTML: paste right after the opening <body> tag
        (put the name you want after "Made by" in CONFIG below)
     ===================================================================== -->
<div id="btx-intro" aria-hidden="true">
  <div class="btx-bg"></div>
  <div class="btx-logo">
    <span class="btx-word">BTechX</span>
    <svg class="btx-chev" viewBox="0 0 40 70"><path d="M8 6 L32 35 L8 64"/></svg>
  </div>
  <div class="btx-line"></div>
  <div class="btx-tag">Engineering • Notes • Redefined</div>
  <div class="btx-by">Made by <b id="btx-by-name"></b></div>
  <div class="btx-skip">Tap to skip</div>
</div>

<!-- DEMO CONTENT: delete this block, your real website goes here -->
<main style="min-height:100vh;display:grid;place-items:center;background:#000;color:#fff;font-family:Poppins,system-ui,sans-serif">
  <h1 style="font-weight:500">Your website loads here</h1>
</main>

<!-- =====================================================================
     4) INTRO JS: paste before the closing </body> tag
     ===================================================================== -->
<script>
(function () {
  var CONFIG = {
    madeBy: "Your Name",   // <-- change this
    totalMs: 3200,         // how long the intro stays before it fades out
    showOnce: true         // true = plays once per browser session
  };

  var el = document.getElementById('btx-intro');
  if (!el) return;
  var root = document.documentElement;

  if (CONFIG.showOnce && root.classList.contains('btx-skip')) { el.remove(); return; }

  document.getElementById('btx-by-name').textContent = CONFIG.madeBy;
  root.classList.add('btx-lock');

  var done = false;
  function finish() {
    if (done) return; done = true;
    try { sessionStorage.setItem('btxIntroSeen', '1'); } catch (e) {}
    el.classList.add('btx-out');
    setTimeout(function () { el.remove(); root.classList.remove('btx-lock'); }, 550);
  }

  el.addEventListener('click', finish);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') finish();
  });

  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(finish, reduced ? 900 : CONFIG.totalMs);
})();
</script>
</body>
</html>
